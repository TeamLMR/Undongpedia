# Redis 서버 설정
redis.host=localhost
redis.port=6379
redis.password=
redis.timeout=10000
redis.database=0

# Redis 커넥션 풀 설정 (최적화)
redis.pool.max-active=50
redis.pool.max-idle=10
redis.pool.min-idle=5
redis.pool.max-wait=10000

# Lettuce
redis.lettuce.pool.max-active=200
redis.lettuce.pool.max-idle=50
redis.lettuce.shutdown-timeout=100

# Redisson ?? (?? ??)
redis.redisson.threads=64
redis.redisson.netty-threads=128
redis.redisson.lock-watchdog-timeout=30000

# Redis ???? (???)
#redis.cluster.nodes=localhost:7001,localhost:7002,localhost:7003

redis.reservation.lock-timeout=10000
redis.reservation.temp-booking-ttl=600