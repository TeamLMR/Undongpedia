# Kafka 브로커 설정
kafka.bootstrap-servers=localhost:1521

# Producer 설정 (성능 최적화)
kafka.producer.acks=all
kafka.producer.retries=3
kafka.producer.batch-size=32768
kafka.producer.linger-ms=10
kafka.producer.buffer-memory=67108864
kafka.producer.compression-type=lz4

# Consumer 설정 (처리량 최적화)
kafka.consumer.group-id=undongpedia-group
kafka.consumer.auto-offset-reset=earliest
kafka.consumer.enable-auto-commit=false
kafka.consumer.session-timeout-ms=30000
kafka.consumer.max-poll-interval-ms=600000
kafka.consumer.max-poll-records=100
kafka.producer.enable-idempotence=true
kafka.producer.max-in-flight-requests=5
kafka.consumer.fetch-min-bytes=1024
kafka.consumer.fetch-max-wait-ms=500

# 토픽 설정
kafka.topic.user-events=user-events
kafka.topic.system-logs=system-logs

# 추가 토픽 설정 (알림·결제·예약·메일)
kafka.topic.notification-events=notification-events
kafka.topic.payment-events=payment-events
kafka.topic.reservation-events=reservation-events
kafka.topic.email-events=email-events

# 파티션 수 설정 (기본 3~10)
kafka.topic.notification-events.partitions=3
kafka.topic.payment-events.partitions=5
kafka.topic.reservation-events.partitions=10
kafka.topic.email-events.partitions=3