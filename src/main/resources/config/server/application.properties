app.name=undongpedia
app.version=1.0

# ?? ??
server.port=8080
server.context-path=/undongpedia

# ??
logging.level.root=INFO
logging.level.org.tlmr=DEBUG

# 로그 레벨 최적화 (성능 향상)
logging.level.com.up.spring.reservation.service.QueueSchedulerService=INFO
logging.level.com.up.spring.payment.controller.PaymentController=INFO
logging.level.org.springframework.data.redis=WARN
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.scheduling=WARN

# Redis 로그 최적화
logging.level.io.lettuce=WARN
logging.level.org.springframework.data.redis.core=WARN

# 웹소켓 로그 최적화  
logging.level.org.springframework.web.socket=WARN

# 스케줄러 로그 최적화
logging.level.org.springframework.scheduling.annotation=WARN

# Application Base URL
app.baseUrl=http://localhost:8080/undongpedia

# Queue Configuration
queue.activation.threshold=10
queue.scheduler.interval=600000
queue.max.concurrent.courses=50
queue.websocket.throttle.ms=2000
queue.max.queue.size=2000